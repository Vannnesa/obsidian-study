<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结构体可视化</title>
<style>
  html, body {
    margin: 0;
    padding: 16px;
    background: #282c34;
    color: #abb2bf;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
  }

  .container {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .column h3 {
    margin: 0 0 16px 0;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    color: #e5c07b;
  }

  .svg-container {
    display: flex;
    justify-content: center;
  }

  .code-block {
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    white-space: pre;
    color: #abb2bf;
  }
  .code-block .kw  { color: #c678dd; }
  .code-block .var { color: #d19a66; }

  .concept-box {
    display: flex;
    align-items: center;
    border: 2px solid #abb2bf;
    padding: 8px 12px;
    gap: 16px;
    background: #21252b;
    border-radius: 6px;
  }
  .concept-box .label {
    font-size: 14px;
    font-weight: 500;
    color: #e5c07b;
  }
  .concept-table {
    border-collapse: collapse;
    border: 2px solid #abb2bf;
    font-size: 13px;
  }
  .concept-table td {
    border: 1px solid #3e4451;
    padding: 4px 12px;
    color: #abb2bf;
  }
  .concept-table td:last-child {
    text-align: right;
    color: #d19a66;
  }
</style>
</head>
<body>

<div class="container">

  <!-- 第一列：可视化 -->
  <div class="column">
    <h3>可视化</h3>
    <div class="svg-container">
      <svg width="132" height="128" viewBox="14 9 132 128" xmlns="http://www.w3.org/2000/svg">
        <!-- 网格线 -->
        <g stroke="#3e4451" stroke-width="0.8">
          <line x1="30" y1="10" x2="30" y2="130" />
          <line x1="50" y1="10" x2="50" y2="130" />
          <line x1="70" y1="10" x2="70" y2="130" />
          <line x1="90" y1="10" x2="90" y2="130" />
          <line x1="110" y1="10" x2="110" y2="130" />
          <line x1="130" y1="10" x2="130" y2="130" />
          <line x1="15" y1="30" x2="145" y2="30" />
          <line x1="15" y1="50" x2="145" y2="50" />
          <line x1="15" y1="70" x2="145" y2="70" />
          <line x1="15" y1="90" x2="145" y2="90" />
          <line x1="15" y1="110" x2="145" y2="110" />
        </g>

        <!-- 虚线矩形 -->
        <rect x="30" y="30" width="100" height="80" fill="none" stroke="#abb2bf" stroke-width="1.5" stroke-dasharray="6,4" />

        <!-- 坐标标签 -->
        <text x="30" y="126" font-size="11" fill="#abb2bf" font-family="sans-serif" text-anchor="middle">(0,0)</text>
        <text x="130" y="22" font-size="11" fill="#abb2bf" font-family="sans-serif" text-anchor="middle">(5,4)</text>

        <!-- 方向标签：白色 -->
        <text x="80" y="22" font-size="13" fill="#ffffff" font-weight="bold" font-family="sans-serif" text-anchor="middle">top</text>
        <text x="80" y="126" font-size="13" fill="#ffffff" font-weight="bold" font-family="sans-serif" text-anchor="middle">bottom</text>
        <text x="22" y="70" font-size="13" fill="#ffffff" font-weight="bold" font-family="sans-serif" transform="rotate(-90 22,70)" text-anchor="middle">left</text>
        <text x="138" y="70" font-size="13" fill="#ffffff" font-weight="bold" font-family="sans-serif" transform="rotate(90 138,70)" text-anchor="middle">right</text>
      </svg>
    </div>
  </div>

  <!-- 第二列：代码片段 -->
  <div class="column">
    <h3>代码片段</h3>
    <pre class="code-block">{
    <span class="kw">int</span> <span class="var">left</span>;
    <span class="kw">int</span> <span class="var">bottom</span>;
    <span class="kw">int</span> <span class="var">right</span>;
    <span class="kw">int</span> <span class="var">top</span>;
}</pre>
  </div>

  <!-- 第三列：概念表示 -->
  <div class="column">
    <h3>概念表示</h3>
    <div class="concept-box">
      <span class="label">myRect</span>
      <table class="concept-table">
        <tr><td>left</td><td>0</td></tr>
        <tr><td>bottom</td><td>0</td></tr>
        <tr><td>right</td><td>5</td></tr>
        <tr><td>top</td><td>4</td></tr>
      </table>
    </div>
  </div>

</div>

</body>
</html>
